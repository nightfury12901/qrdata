<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photon — Receiver</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="receiver-page">
  <!-- Landscape-only prompt -->
  <div class="rotate-prompt">
    <div class="icon">📱↻</div>
    <div>Rotate your phone to <strong>landscape</strong></div>
  </div>

  <!-- Camera feed -->
  <video id="cameraVideo" autoplay playsinline muted></video>

  <!-- Debug overlay -->
  <canvas id="overlayCanvas"></canvas>

  <!-- Stats panel -->
  <div class="stats-panel" id="statsPanel">
    <div><span class="label">Status: </span><span class="value" id="statStatus">Initializing…</span></div>
    <div><span class="label">Decode FPS: </span><span class="value" id="statFPS">—</span></div>
    <div><span class="label">Success rate: </span><span class="value" id="statRate">—</span></div>
    <div><span class="label">Throughput: </span><span class="value" id="statThroughput">—</span></div>
    <div><span class="label">Errors fixed: </span><span class="value" id="statErrors">—</span></div>
    <div><span class="label">Progress: </span><span class="value" id="statProgress">—</span></div>
    <div><span class="label">Anchors: </span><span class="value" id="statAnchors">—</span></div>
    <div><span class="label">px/cell: </span><span class="value" id="statPxCell">—</span></div>
    <div style="margin-top:8px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
        <span class="label">Reassembled Output:</span>
        <div style="display:flex; gap:4px;">
          <button id="btnReset" style="background:#555; color:#fff; border:none; border-radius:4px; padding:2px 8px; cursor:pointer; font-size:12px;">Reset</button>
          <button id="btnCopy" style="background:#333; color:#fff; border:none; border-radius:4px; padding:2px 8px; cursor:pointer; font-size:12px;">Copy Text</button>
          <a id="btnDownload" style="display:none; background:#39f; color:#fff; border:none; border-radius:4px; padding:2px 8px; cursor:pointer; font-size:12px; text-decoration:none;">Download File</a>
        </div>
      </div>
      <div id="fileProgress" style="display:none; font-size:12px; color:#aaa; margin-bottom:4px;"></div>
      <textarea id="statMessage" readonly rows="3" style="width:100%; background:#000; color:#0f0; border:1px solid #333; padding:4px; font-family:monospace; resize:none;">Waiting for frames...</textarea>
      <div id="filePreviewContainer" style="margin-top: 10px; width: 100%; text-align: center;"></div>
    </div>
  </div>

  <!-- Load modules (order matters: detect and homography before receiver) -->
  <script src="reedsolomon.js?v=5"></script>
  <script src="protocol.js?v=5"></script>
  <script src="detect.js?v=5"></script>
  <script src="homography.js?v=5"></script>
  <script src="receiver.js?v=5"></script>
</body>

</html>
