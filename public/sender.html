<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photon — Sender</title>
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body class="sender-page">
  <div class="sender-controls">
    <div style="display:flex; gap:8px;">
      <textarea id="msgInput" placeholder="Enter message to send..." rows="2" style="width:200px; background:#1a1a2e; color:#0f0; border:1px solid #333; padding:4px; font-family:monospace; border-radius:4px; resize:none;"></textarea>
      <div style="display:flex; flex-direction:column; gap:4px; justify-content:center;">
        <label style="font-size:12px; color:#aaa;">Or send a file (max 1MB):</label>
        <input type="file" id="fileInput" style="font-size:12px; max-width: 150px;" />
      </div>
    </div>
    
    <div style="display:flex; flex-direction:column; gap:4px; width: 100px;">
      <label style="font-size:12px; color:#aaa; display:flex; justify-content:space-between;">Speed: <span id="speedLabel">60ms</span></label>
      <input type="range" id="speedSlider" min="30" max="300" step="10" value="60" style="width:100%;" />
    </div>

    <div style="display:flex; flex-direction:column; gap:4px;">
      <button class="btn" id="btnStart">Start TX</button>
      <button class="btn" id="btnStop" disabled>Stop</button>
    </div>
    <div style="display:flex; flex-direction:column; gap:4px; font-size:12px; color:#aaa; min-width:120px;">
      <span id="txStatus">Idle</span>
      <span id="txFrame">—</span>
    </div>
  </div>
  <canvas id="gridCanvas"></canvas>
  <!-- Load modules (order matters: reedsolomon, fountain, protocol, then sender) -->
  <script src="reedsolomon.js?v=7"></script>
  <script src="fountain.js?v=7"></script>
  <script src="protocol.js?v=7"></script>
  <script src="sender.js?v=7"></script>
</body>
</html>
