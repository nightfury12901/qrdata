<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photon — Sender v86</title>
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body class="sender-page">
  <div class="sender-controls">
    <div style="display:flex; flex-direction:column; gap:8px;">
      <textarea id="msgInput" placeholder="Enter message to send..." rows="4" style="width:100%; background:#1a1a2e; color:#0f0; border:1px solid #333; padding:8px; font-family:monospace; border-radius:4px; resize:none;"></textarea>
      <div style="display:flex; flex-direction:column; gap:4px;">
        <label style="font-size:12px; color:#aaa;">Or send a file (auto-zipped if &gt;1MB):</label>
        <input type="file" id="fileInput" style="font-size:12px; width: 100%;" />
      </div>
    </div>
    
    <div style="display:flex; flex-direction:column; gap:4px; margin-top: 10px;">
      <label style="font-size:12px; color:#aaa; display:flex; justify-content:space-between;">Speed: <span id="speedLabel">60ms</span></label>
      <input type="range" id="speedSlider" min="16" max="200" step="1" value="16" style="width:100%;" />
    </div>

    <div style="display:flex; flex-direction:column; gap:8px; margin-top: 10px;">
      <button class="btn" id="btnPrepare">Prepare Session</button>
      <button class="btn" id="btnStart" disabled>Start Broadcast</button>
      <button class="btn" id="btnStop" disabled>Stop</button>
      <button class="btn" id="btnFullscreen" style="background:#0066cc;">Fullscreen</button>
      <button class="btn" id="btnLoopback" style="background:#444;font-size:10px">Test CRC Codec</button>
    </div>
    <div style="display:flex; flex-direction:column; gap:8px; font-size:12px; color:#aaa; margin-top: 10px; background: #000; padding: 10px; border-radius: 6px;">
      <div>Status: <span id="txStatus" style="color: #fff">Idle</span></div>
      <div id="txFrame">—</div>
      <div id="txChunks" style="color:#0f0;"></div>
    </div>
  </div>
  <div id="canvasContainer">
    <canvas id="gridCanvas"></canvas>
  </div>
  <div style="position:absolute; top:10px; right:10px; color:#fff; font-family:monospace; font-size:12px; background:#222; padding:4px 8px; border-radius:4px; z-index:100;">v91</div>
  <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
  <script src="reedsolomon.js"></script>
  <script src="protocol_v89.js"></script>
  <script src="sender_v89.js"></script>
</body>
</html>
