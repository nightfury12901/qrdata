<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photon — Optical Data Transfer</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .index-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 24px;
      text-align: center;
    }
    .index-page h1 {
      font-size: 32px;
      font-weight: 300;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #0f0;
    }
    .index-page .subtitle {

      font-size: 14px;
      margin-top: -12px;
    }
    .nav-links {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }
    .nav-links a {
      padding: 16px 36px;
      border: 1px solid #444;
      border-radius: 8px;
      color: #eee;

    .nav-links a:hover {
      background: #222;

    <div class="nav-links">
